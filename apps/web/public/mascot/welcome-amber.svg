<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  role="img"
  aria-label="AVEN 圆形角色"
>
  <g class="float">
    <g class="tilt">
      <g class="pulse">
        <circle class="body" cx="100" cy="100" r="79" fill="#ff7900" />
        <g class="look">
          <g class="expression">
            <g class="eye eye-left">
              <g class="lid">
                <rect
                  x="71"
                  y="57"
                  width="18"
                  height="39"
                  rx="9"
                  fill="#131313"
                  transform="rotate(7 80 76.5)"
                />
              </g>
            </g>
            <g class="eye eye-right">
              <g class="lid">
                <rect
                  x="107"
                  y="59"
                  width="18"
                  height="39"
                  rx="9"
                  fill="#131313"
                  transform="rotate(7 116 78.5)"
                />
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
