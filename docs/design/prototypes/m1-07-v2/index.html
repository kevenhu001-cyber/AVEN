<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVEN · 产品界面设计 v0.2</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0b0b0b;
        --foreground: #f3f3f1;
        --muted: #a8a8a8;
        --card: #111;
        --popover: #282828;
        --secondary: #202020;
        --border: #303030;
        --ring: #89a795;
        --primary: #f2f2f0;
        --accent: #89a795;
        --destructive: #e39595;
        --warning: #d8b06a;
        --success: #8fbf9f;
        --info: #9db6c9;
        --control: #707781;
        --on-primary: #171717;
        --radius: 18px;
        --font-sans:
          Inter, Geist, ui-sans-serif, system-ui, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei',
          sans-serif;
      }
      [data-theme='light'] {
        color-scheme: light;
        --background: #fff;
        --foreground: #202020;
        --muted: #62625d;
        --card: #f7f7f5;
        --popover: #fff;
        --secondary: #f0f0ee;
        --border: #dededb;
        --ring: #526b5f;
        --primary: #202020;
        --accent: #526b5f;
        --destructive: #a33d3d;
        --warning: #80601e;
        --success: #356847;
        --info: #365c76;
        --control: #85857f;
        --on-primary: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      button:hover:not(:disabled) {
        background: var(--secondary);
      }
      a {
        color: var(--accent);
      }
      svg {
        width: 21px;
        height: 21px;
        stroke-width: 1.65;
        flex: none;
        vertical-align: middle;
      }
      button svg {
        pointer-events: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: absolute;
        z-index: 50;
        top: -100px;
        left: 12px;
        padding: 12px;
        background: var(--popover);
      }
      .skip:focus {
        top: 10px;
      }
      .app {
        height: 820px;
        max-height: 20000px;
        min-height: 600px;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        position: relative;
        overflow: hidden;
        isolation: isolate;
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      .sidebar {
        background: var(--card);
        padding: 18px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
        z-index: 12;
      }
      .brandbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 12px;
      }
      .wordmark {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      .icon-button {
        width: 44px;
        min-width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav button,
      .history button {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        text-align: left;
        min-height: 46px;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .nav button.active {
        background: var(--secondary);
        font-weight: 500;
      }
      .nav .newchat {
        background: var(--secondary);
        margin-bottom: 14px;
      }
      .nav-count {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .section-label {
        color: var(--muted);
        font-size: 0.75rem;
        margin: 0 12px 8px;
      }
      .history {
        margin-top: 6px;
        overflow: auto;
      }
      .history button {
        font-size: 0.875rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-footer {
        margin-top: auto;
        position: relative;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px;
        border-radius: 12px;
        text-align: left;
      }
      .avatar {
        background: var(--secondary);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 0.8rem;
        flex: none;
      }
      .profile-name {
        font-weight: 500;
      }
      .profile-sub {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .profile-chevron {
        margin-left: auto;
        color: var(--muted);
      }
      .workspace {
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--background);
        position: relative;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 72px;
        padding: 12px 28px;
        flex-shrink: 0;
      }
      .topbar-left,
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .top-title {
        font-size: 1.0625rem;
        font-weight: 500;
        white-space: nowrap;
      }
      .top-title span {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 400;
        margin-left: 12px;
      }
      .badge {
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .mobile-toggle {
        display: none;
      }
      .scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        scroll-behavior: smooth;
        scrollbar-width: thin;
      }
      .content {
        max-width: 850px;
        margin: 0 auto;
        padding: 38px 40px 48px;
      }
      .page-intro {
        margin-bottom: 30px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.8rem;
        line-height: 1.35;
        font-weight: 500;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.45;
      }
      h3 {
        font-size: 1rem;
        font-weight: 500;
      }
      p {
        line-height: 1.8;
      }
      .sub {
        color: var(--muted);
        font-size: 0.875rem;
      }
      .page-intro .sub {
        margin-top: 10px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 0.75rem;
        margin-bottom: 10px;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .spacer {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 0.875rem;
        white-space: normal;
      }
      .btn.primary {
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 500;
      }
      .btn.primary:hover {
        opacity: 0.88;
        background: var(--primary);
      }
      .btn.secondary {
        border: 1px solid var(--control);
      }
      .btn.danger {
        color: var(--destructive);
        border: 1px solid var(--control);
      }
      .text-link {
        color: var(--muted);
        padding: 8px 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.875rem;
        min-height: 44px;
      }
      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 0.8125rem;
        min-height: 38px;
      }
      .pill.selected {
        border-color: var(--control);
        background: var(--secondary);
        color: var(--foreground);
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }
      .label {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .notice {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 0.875rem;
      }
      .notice .row {
        align-items: flex-start;
      }
      .notice svg {
        color: var(--accent);
        margin-top: 3px;
      }
      .quiet-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
      }
      .muted {
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
      }
      .danger-text {
        color: var(--destructive);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .meta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.8125rem;
        margin-top: 10px;
      }
      .meta span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .meta svg {
        width: 15px;
        height: 15px;
      }
      .list-row {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .list-row:first-child {
        padding-top: 8px;
      }
      .list-row .row-body {
        flex: 1;
        min-width: 0;
      }
      .list-row h2 {
        margin-bottom: 8px;
      }
      .list-row .sub {
        max-width: 60ch;
      }
      .list-row .icon-button {
        margin-top: 4px;
      }
      .status-text {
        font-size: 0.75rem;
        color: var(--accent);
      }
      .chat-screen {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 840px;
        margin: auto;
        padding: 0 36px 22px;
      }
      .chat-hero {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 250px;
        padding: 24px 0;
      }
      .chat-hero h1 {
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.035em;
      }
      .chat-hero p {
        margin-top: 14px;
        max-width: 30em;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .chat-messages {
        padding: 32px 0 24px;
        flex: 1;
        overflow: auto;
        min-height: 180px;
      }
      .message {
        margin-bottom: 30px;
        max-width: 96%;
      }
      .message.user {
        margin-left: auto;
        max-width: 85%;
        padding: 12px 20px;
        border-radius: 22px;
        background: var(--secondary);
        width: fit-content;
      }
      .message.assistant {
        padding: 0 4px;
      }
      .message .message-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .message p {
        font-size: 0.9375rem;
        white-space: pre-wrap;
      }
      .message .notice {
        margin-top: 18px;
      }
      .suggestions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .suggestions button {
        font-size: 0.8125rem;
        color: var(--muted);
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        min-height: 42px;
      }
      .composer {
        border-radius: 24px;
        background: var(--secondary);
        padding: 16px 14px 10px;
        box-shadow: 0 0 0 1px var(--border);
      }
      .composer textarea {
        display: block;
        resize: none;
        width: 100%;
        height: 54px;
        max-height: 150px;
        background: none;
        border: 0;
        outline: none;
        padding: 0 8px;
        color: var(--foreground);
        font-size: 1rem;
        line-height: 1.6;
      }
      .composer textarea::placeholder {
        color: var(--muted);
      }
      .composer:focus-within {
        box-shadow: 0 0 0 1px var(--control);
      }
      .composer textarea:focus-visible {
        outline: none;
      }
      .composer-toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .composer .context-button {
        font-size: 0.75rem;
        display: flex;
        gap: 6px;
        align-items: center;
        min-height: 44px;
        padding: 6px 8px;
        border-radius: 10px;
        color: var(--muted);
      }
      .composer .context-button svg {
        width: 16px;
      }
      .send-button {
        background: var(--primary);
        color: var(--on-primary);
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin-left: 4px;
      }
      .send-button:hover:not(:disabled) {
        background: var(--primary);
        opacity: 0.85;
      }
      .chat-footnote {
        text-align: center;
        color: var(--muted);
        font-size: 0.6875rem;
        padding: 12px 0 0;
      }
      .chat-tabs {
        display: flex;
        gap: 3px;
        background: var(--card);
        padding: 3px;
        border-radius: 999px;
      }
      .chat-tabs button {
        padding: 6px 18px;
        border-radius: 999px;
        min-height: 36px;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .chat-tabs button.active {
        background: var(--secondary);
        color: var(--foreground);
      }
      .search-field {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        min-height: 48px;
        border: 1px solid var(--control);
        border-radius: 14px;
        margin-bottom: 16px;
      }
      .search-field input {
        width: 100%;
        border: 0;
        background: none;
        outline: none;
        min-width: 0;
        padding: 10px 0;
      }
      .search-field:focus-within {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 28px;
      }
      .org-mark {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .org-mark svg {
        width: 22px;
      }
      .detail-header {
        margin: 20px 0 28px;
      }
      .detail-header h1 {
        margin-top: 16px;
        max-width: 24em;
      }
      .detail-section {
        margin-top: 28px;
      }
      .detail-section p {
        margin-top: 12px;
        font-size: 0.9375rem;
      }
      .detail-section ul {
        padding-left: 20px;
        margin: 12px 0;
        line-height: 2.1;
      }
      .detail-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        border-block: 1px solid var(--border);
        padding: 20px 0;
        margin: 24px 0;
      }
      .detail-stats strong {
        display: block;
        font-size: 0.9375rem;
        font-weight: 500;
        margin-top: 5px;
      }
      .sticky-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 32px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .check-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .check-row input {
        accent-color: var(--accent);
        margin-top: 5px;
        width: 18px;
        height: 18px;
        flex: none;
      }
      .check-row .field-body {
        flex: 1;
      }
      .field-title {
        display: flex;
        justify-content: space-between;
        font-size: 0.875rem;
        font-weight: 500;
        gap: 8px;
      }
      .field-value {
        font-size: 0.875rem;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.8;
      }
      .field-tag {
        font-size: 0.6875rem;
        font-weight: 400;
        color: var(--muted);
      }
      .input-label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.875rem;
      }
      .select {
        border: 1px solid var(--control);
        background: var(--background);
        padding: 10px 12px;
        border-radius: 10px;
        max-width: 100%;
        min-height: 44px;
      }
      .timeline {
        margin-top: 24px;
      }
      .timeline-item {
        border-left: 1px solid var(--border);
        padding: 0 0 28px 22px;
        margin-left: 8px;
      }
      .timeline-item:last-child {
        border: 0;
      }
      .timeline-item strong {
        font-weight: 500;
        font-size: 0.875rem;
      }
      .timeline-item p {
        margin-top: 4px;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .settings-layout {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        gap: 32px;
        margin-top: 30px;
      }
      .settings-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .settings-nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 10px 12px;
        min-height: 46px;
        border-radius: 10px;
        font-size: 0.875rem;
      }
      .settings-nav button.active {
        background: var(--secondary);
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 0;
        border-bottom: 1px solid var(--border);
        gap: 20px;
      }
      .settings-row h3 {
        font-size: 0.875rem;
      }
      .settings-row p {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .settings-row select {
        max-width: 150px;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 74px;
        border: 1px solid var(--control);
        border-radius: 999px;
        font-size: 0.75rem;
      }
      .toggle[aria-pressed='true'] {
        background: var(--secondary);
        color: var(--accent);
      }
      .memory-card {
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
      }
      .memory-card h3 {
        margin-bottom: 6px;
      }
      .memory-card .meta {
        margin-top: 14px;
      }
      .profile-menu {
        position: absolute;
        bottom: 72px;
        left: 0;
        width: 260px;
        max-width: calc(100% + 12px);
        padding: 8px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--popover);
        box-shadow: 0 12px 36px #0004;
        z-index: 20;
      }
      .profile-menu button {
        width: 100%;
        padding: 11px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        border-radius: 10px;
        text-align: left;
        font-size: 0.875rem;
      }
      .profile-menu .divider {
        margin: 8px;
      }
      .profile-menu .menu-caption {
        padding: 10px 12px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .bottom-nav {
        display: none;
        background: var(--background);
        border-top: 1px solid var(--border);
        padding: 6px 6px max(8px, env(safe-area-inset-bottom));
        flex-shrink: 0;
      }
      .bottom-nav button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 3px;
        color: var(--muted);
        font-size: 0.6875rem;
        border-radius: 10px;
        min-height: 50px;
      }
      .bottom-nav button.active {
        color: var(--foreground);
      }
      .bottom-nav button.active svg {
        stroke-width: 2;
      }
      .drawer-shade {
        display: none;
        position: absolute;
        inset: 0;
        background: #0008;
        z-index: 11;
      }
      .app.collapsed {
        grid-template-columns: 68px minmax(0, 1fr);
      }
      .app.collapsed .sidebar {
        padding-inline: 8px;
      }
      .app.collapsed .sidebar .nav-label,
      .app.collapsed .section-label,
      .app.collapsed .history,
      .app.collapsed .brandbar .wordmark,

              <option value="light">浅色</option>

      </details>
    </footer>

            return `<h2>通知</h2><div class="settings-row"><div><h3>引荐与关系提醒</h3><p>仅演示偏好开关，不会投递通知。</p></div><button class="toggle" data-action="notification" aria-pressed="${state.notification}">${state.notification ? '已开启' : '已关闭'}</button></div><div style="margin-top:20px">${notice('站内通知与移动推送尚未实现。偏好仅保留在本次原型演示中。', 'bell-off')}</div>`;
          case 'privacy':
            return `<h2>数据与隐私</h2><div class="settings-row"><div><h3>管理对外授权</h3><p>检查接收方、用途、字段和期限。</p></div>${link('查看', 'privacy')}</div><div class="settings-row"><div><h3>管理记忆</h3><p>查看已确认信息与使用范围。</p></div>${link('查看', 'memory')}</div>`;
          case 'provider':
            return `<h2>AI 服务</h2><div class="settings-row"><div><h3>当前演示模式</h3><p>不向外部模型发送任何数据。</p></div><span class="badge">Mock</span></div><div style="margin-top:20px">${notice('用户级模型配置 API 已存在，但尚未接入 Worker 与产品界面。本稿不采集 API 密钥，也不提供真实连接测试。', 'info')}</div>`;
          default:
            return `<h2>常规</h2><div class="settings-row"><div><h3>语言</h3><p>界面与默认内容语言。</p></div><span class="sub">简体中文</span></div><div class="settings-row"><div><h3>按 Enter 发送</h3><p>中文输入法组合态不会触发发送。</p></div><button class="toggle" data-action="enter-send" aria-pressed="${state.enterSend}">${state.enterSend ? '已开启' : '已关闭'}</button></div><div class="settings-row"><div><h3>当前身份</h3><p>${state.identity === 'personal' ? '林同学 · 个人空间' : '机器人学习实验室 · 组织空间'}</p></div>${btn('切换', 'switch-identity', 'secondary')}</div>`;
        }
      }
      function toast(text) {
        clearTimeout(toastTimer);
        $('#toast').textContent = text;
        $('#toast').hidden = false;
        toastTimer = setTimeout(() => ($('#toast').hidden = true), 5000);
      }
      function openDialog(title, body, confirm, action, danger = false) {
        dialogTrigger = document.activeElement;
        dialogAction = action;
        $('#modal-title').textContent = title;
        $('#modal-body').innerHTML = body;
        $('#modal-confirm').textContent = confirm;
        $('#modal-confirm').className = 'btn ' + (danger ? 'danger' : 'primary');
        $('#modal').showModal();
        $('#modal-cancel').focus();
      }
      function closeDialog() {
        if ($('#modal').open) $('#modal').close();
        dialogAction = null;
        if (dialogTrigger?.isConnected) dialogTrigger.focus();
        else $('#main-content').focus({ preventScroll: true });
      }
      function closeMenu() {
        $('#profile-menu').hidden = true;
        $('#profile').setAttribute('aria-expanded', 'false');
      }
      function closeDrawer() {
        $('#app').classList.remove('drawer-open');
        $('#open-drawer').setAttribute('aria-expanded', 'false');
        if (matchMedia('(max-width:560px)').matches) {
          $('#sidebar').inert = true;
          $('#main-content').inert = false;
          $('#bottom-nav').inert = false;
        }
      }
      function openDrawer() {
        $('#app').classList.add('drawer-open');
        $('#sidebar').inert = false;
        $('#main-content').inert = true;
        $('#bottom-nav').inert = true;
        $('#open-drawer').setAttribute('aria-expanded', 'true');
        $('#collapse').focus();
      }
      function stopGeneration() {
        clearTimeout(timer);
        state.generating = false;
      }
      function sendMessage() {
        const prompt = $('#prompt');
        const text = prompt?.value.trim();
        if (!text || state.generating) return;
        state.messages.push({ role: 'user', text });
        state.generating = true;
        render();
        timer = setTimeout(() => {
          state.generating = false;
          state.messages.push({
            role: 'assistant',
            text: '我们可以从你想参与的研究方向、每周能投入的时间，以及希望获得的经验开始。\n\n这里有一组用于设计演示的科研机会。你可以先浏览，找到感兴趣的项目后，再逐项确认需要共享的资料。',
          });
          render();
          $('#messages').scrollTop = $('#messages').scrollHeight;
        }, 900);
      }
      const actions = {
        newchat: () => {
          stopGeneration();
          state.messages = [];
          navigate('ai');
          $('#prompt')?.focus();
        },
        history: () => {
          state.messages = [
            { role: 'user', text: '我想从一个小项目开始，探索机器人方向。' },
            {
              role: 'assistant',
              text: '可以先考虑基础数据分析或复现实验。下面的机会是设计样例，你可以查看要求，并在申请前决定共享范围。',
            },
          ];
          navigate('ai');
        },
        suggest: () => {
          $('#prompt').value = '帮我寻找每周投入 6–8 小时的机器人科研机会。';
          $('#prompt').focus();
        },
        context: () =>
          openDialog(
            '选择本次 AI 上下文',
            `<p class="sub">默认仅使用本次输入。选择后只演示加入明确允许本人 AI 的样例资料，不扩大对外共享范围。</p><label class="check-row"><input id="context-check" type="checkbox" ${state.context ? 'checked' : ''}><span>希望参与机器人相关研究<br><span class="sub">已确认 · 允许本人 AI · v1</span></span></label>`,
            '使用所选范围',
            () => {
              state.context = $('#context-check').checked;
              render();
            },
          ),
        stop: () => {
          stopGeneration();
          render();
          toast('已停止演示回复，没有执行业务行动。');
        },
        apply: () => {
          state.consentFields = ['name', 'skills'];
          state.relation = false;
          navigate('consent');
        },
        'send-referral': () => {
          if (!state.consentFields.length) return;
          const expiry = $('#consent-expiry').value;
          const chosen = state.consentFields
            .map((k) => fields[k][0] + '：' + fields[k][1])
            .join('<br>');
          openDialog(
            '确认本次共享',
            `<p>接收方：${esc(selectedOpportunity.org)}</p><p class="sub">组织中当前有代表权限的成员可读。</p><div class="detail-pair"><span>引荐用途 · ${expiry} 天</span>${chosen}</div>${state.relation ? `<div class="detail-pair"><span>独立关系用途 · 建立后 7 天</span>${chosen}</div>` : '<p class="sub" style="margin-top:16px">未授权关系用途。建立关系后，共享上下文为空。</p>'}<p class="sub" style="margin-top:16px">此处仅演示确认流程，不发送真实引荐。</p>`,
            '确认演示发送',
            () => {
              state.sent = true;
              state.accepted = false;
              state.withdrawn = false;
              state.revoked = false;
              state.relationRevoked = false;
              state.expiry = expiry;
              navigate('referrals');
              toast('样例引荐已发送，等待组织回应。');
            },
          );
        },
        withdraw: () =>
          openDialog(
            '撤回此引荐？',
            '<p>此样例引荐将停止处理，其引荐授权同步失效。再次申请需要新的预览与确认。</p>',
            '确认撤回',
            () => {
              state.withdrawn = true;
              state.revoked = true;
              render();
              toast('样例引荐已撤回。');
            },
            true,
          ),
        accept: () => {
          if (state.sent && state.revoked) {
            toast('引荐授权已撤销，请重新取得有效授权。');
            return;
          }
          openDialog(
            '接受并建立关系空间？',
            `<p>你正代表${esc(selectedOpportunity.org)}处理此样例引荐。双方接受后建立唯一关系空间；没有独立关系用途授权时，共享上下文为空。</p>`,
            '接受并建立',
            () => {
              state.accepted = true;
              navigate('space');
              toast('样例关系已建立。');
            },
          );
        },
        'request-more': () =>
          openDialog(
            '请求补充资料',
            '<p class="sub">说明需要补充的内容与用途。补充资料仍需对方重新预览与授权。</p><label class="input-label">补充说明<textarea id="decision-note" maxlength="500" placeholder="例如：请补充每周可投入的时间"></textarea></label>',
            '发送演示请求',
            () => {
              toast('样例请求已记录，未投递真实通知。');
            },
          ),
        reject: () =>
          openDialog(
            '拒绝此引荐？',
            '<p>此处仅演示组织决定。拒绝后不建立关系空间。</p>',
            '确认拒绝',
            () => {
              state.variant = 'empty';
              render();
              toast('样例引荐已拒绝。');
            },
            true,
          ),
        'view-snapshot': () =>
          openDialog(
            '此授权的快照',
            state.revoked
              ? '<p>授权已撤销，受限快照已隐藏。</p>'
              : `<p class="sub">接收方：${esc(selectedOpportunity.org)} · 用途：引荐</p>${state.consentFields.map((k) => `<div class="detail-pair"><span>${fields[k][0]}</span>${fields[k][1]}</div>`).join('')}`,
            '知道了',
            () => {},
          ),
        revoke: () =>
          openDialog(
            '撤销此引荐授权？',
            `<p>接收方：${esc(selectedOpportunity.org)}</p><div class="detail-pair"><span>用途：引荐</span>字段：${state.consentFields.map((k) => fields[k][0]).join('、')}</div><p class="sub" style="margin-top:16px">系统将拒绝此授权的新读取。已送达内容或系统外副本无法收回；独立的关系用途授权不受此操作影响。</p>`,
            '确认撤销',
            () => {
              state.revoked = true;
              render();
              toast('此授权已撤销，系统将拒绝新的授权读取；已送达内容或系统外副本无法收回。');
            },
            true,
          ),
        'view-relation-snapshot': () =>
          openDialog(
            '关系用途快照',
            state.relationRevoked
              ? '<p>关系用途授权已撤销，快照已隐藏。</p>'
              : `<p class="sub">用途：关系上下文 · 独立授权</p>${state.consentFields.map((k) => `<div class="detail-pair"><span>${fields[k][0]}</span>${fields[k][1]}</div>`).join('')}`,
            '知道了',
            () => {},
          ),
        'revoke-relation': () =>
          openDialog(
            '撤销关系用途授权？',
            `<p>接收方：${esc(selectedOpportunity.org)}</p><p>用途：关系上下文 · 字段：${state.consentFields.map((k) => fields[k][0]).join('、')}</p><p class="sub" style="margin-top:16px">关系空间的受限快照将被隐藏。独立的引荐授权不受影响，已送达内容或系统外副本无法收回。</p>`,
            '确认撤销',
            () => {
              state.relationRevoked = true;
              render();
              toast('关系用途授权已撤销，引荐授权保持原状。');
            },
            true,
          ),
        'switch-identity': () => {
          state.identity = state.identity === 'personal' ? 'organization' : 'personal';
          state.settings = 'general';
          navigate(state.identity === 'organization' ? 'inbox' : 'today');
        },
        'settings-back': () => {
          state.settingDetail = false;
          render();
        },
        recover: () => {
          state.identity = 'personal';
          navigate(state.variant === 'denied' ? 'today' : state.route);
        },
        'go-discover': () => navigate('discover'),
        'go-space': () => navigate('space'),
        'clear-search': () => {
          state.query = '';
          state.filter = '全部';
          render();
        },
        'enter-send': () => {
          state.enterSend = !state.enterSend;
          render();
        },
        notification: () => {
          state.notification = !state.notification;
          render();
        },
        'memory-confirmed': () => toast('当前展示已确认的样例记忆。'),
        'review-memory': () =>
          state.pendingMemories
            ? openDialog(
                '复核候选记忆',
                '<p>候选：希望每周稳定投入 6–8 小时参与研究。</p><p class="sub" style="margin-top:12px">来源：样例对话。确认后仅用于本人 AI；不自动参与匹配或共享。</p>',
                '确认样例记忆',
                () => {
                  state.pendingMemories--;
                  state.reviewed = true;
                  render();
                  toast('样例候选已确认；未修改真实记忆。');
                },
              )
            : toast('待复核样例已全部处理。'),
      };
      document.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.route) {
          navigate(t.dataset.route);
          return;
        }
        if (t.dataset.opportunity) {
          selectedOpportunity = opportunities.find((o) => o.id === t.dataset.opportunity);
          navigate('detail');
          return;
        }
        if (t.dataset.filter) {
          state.filter = t.dataset.filter;
          render();
          return;
        }
        if (t.dataset.setting) {
          state.settings = t.dataset.setting;
          state.settingDetail = true;
          render();
          return;
        }
        if (t.dataset.action) {
          actions[t.dataset.action]?.();
        }
      });
      document.addEventListener('input', (e) => {
        if (e.target.id === 'opportunity-search') {
          state.query = e.target.value;
          $('#opportunity-results').innerHTML = results();
        }
      });
      document.addEventListener('change', (e) => {
        if (e.target.dataset.field) {
          state.consentFields = [...document.querySelectorAll('[data-field]:checked')].map(
            (i) => i.dataset.field,
          );
          $('#consent-summary').textContent =
            `已选择 ${state.consentFields.length} 个字段 · 用途：引荐`;
          const send = $('[data-action="send-referral"]');
          send.disabled = !state.consentFields.length;
        }
        if (e.target.id === 'relation-consent') state.relation = e.target.checked;
        if (['theme-select', 'review-theme'].includes(e.target.id)) {
          document.documentElement.dataset.theme = e.target.value;
          $('#review-theme').value = e.target.value;
        }
        if (e.target.id === 'review-state') {
          state.variant = e.target.value;
          render();
        }
      });
      document.addEventListener('submit', (e) => {
        if (e.target.id === 'chat-form') {
          e.preventDefault();
          sendMessage();
        }
      });
      let composing = false;
      document.addEventListener('compositionstart', () => (composing = true));
      document.addEventListener('compositionend', () => (composing = false));
      document.addEventListener('keydown', (e) => {
        if (
          e.target.id === 'prompt' &&
          e.key === 'Enter' &&
          !e.shiftKey &&
          !e.isComposing &&
          !composing &&
          state.enterSend
        ) {
          e.preventDefault();
          sendMessage();
        }
        if (e.key === 'Escape') {
          const wasMenuOpen = !$('#profile-menu').hidden;
          closeMenu();
          if (wasMenuOpen) $('#profile').focus();
          if ($('#app').classList.contains('drawer-open')) {
            closeDrawer();
            $('#open-drawer').focus();
          }
        }
        if (e.key === 'Tab' && $('#app').classList.contains('drawer-open') && !$('#modal').open) {
          const nodes = [...$('#sidebar').querySelectorAll('button:not(:disabled)')].filter(
            (n) => n.getClientRects().length,
          );
          const first = nodes[0],
            last = nodes.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });
      $('#profile').addEventListener('click', () => {
        const open = $('#profile-menu').hidden;
        $('#profile-menu').hidden = !open;
        $('#profile').setAttribute('aria-expanded', String(open));
        if (open) $('#profile-menu button').focus();
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.sidebar-footer')) closeMenu();
      });
      $('#open-drawer').addEventListener('click', openDrawer);
      $('#drawer-shade').addEventListener('click', () => {
        closeDrawer();
        $('#open-drawer').focus();
      });
      $('#collapse').addEventListener('click', () => {
        if (matchMedia('(max-width:560px)').matches) {
          closeDrawer();
          $('#open-drawer').focus();
        } else {
          const collapsed = $('#app').classList.toggle('collapsed');
          $('#collapse').setAttribute('aria-label', collapsed ? '展开导航' : '收起导航');
        }
      });
      $('#modal-cancel').addEventListener('click', closeDialog);
      $('#modal-confirm').addEventListener('click', () => {
        const action = dialogAction;
        closeDialog();
        action?.();
      });
      $('#modal').addEventListener('cancel', (e) => {
        e.preventDefault();
        closeDialog();
      });
      matchMedia('(max-width:560px)').addEventListener('change', () => {
        closeDrawer();
        if (!matchMedia('(max-width:560px)').matches) $('#sidebar').inert = false;
      });
      window.addEventListener('hashchange', () => {
        const r = location.hash.slice(1);
        if (names[r] && r !== state.route) {
          state.route = r;
          state.variant = 'success';
          render();
        }
      });
      if (names[location.hash.slice(1)]) state.route = location.hash.slice(1);
      render();
      closeDrawer();
    </script>
  </body>
</html>
