# AVEN development validation deployment; Mock Provider, local mail sink.
server {
    listen 80;
    listen [::]:80;
    server_name aven.topodrive.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aven.topodrive.top;
        try_files $uri =404;
    }
    location / { return 301 https://aven.topodrive.top$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aven.topodrive.top;
    ssl_certificate /etc/letsencrypt/live/aven.topodrive.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aven.topodrive.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 1m;
    access_log off;
    error_log /var/log/nginx/aven.topodrive.top.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control 'private, no-store' always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aven.topodrive.top;
        try_files $uri =404;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_cookie_flags aven_session secure httponly samesite=lax;
        proxy_cookie_flags aven_csrf secure samesite=lax;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }
    location /health/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
    }
}
